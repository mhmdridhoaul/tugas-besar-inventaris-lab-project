name: lab-inventory-system

services:
  # ==========================================
  # BACKEND SERVICE (Python REST API)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-inventory-backend:latest
    container_name: lab-inventory-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATA_PATH=/var/lib/lab-inventory-data/inventory.json
    volumes:
      # Named Volume untuk persistensi data (Data Immunity)
      - lab-inventory-data:/var/lib/lab-inventory-data
    networks:
      - app-net

  # ==========================================
  # FRONTEND SERVICE (Nginx Web Server)
  # ==========================================
  frontend:
    image: nginx:alpine
    container_name: lab-inventory-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Bind Mount file HTML agar perubahan UI langsung terlihat tanpa rebuild
      - ./index.html:/usr/share/nginx/html/index.html:ro
      # Bind Mount konfigurasi Nginx Reverse Proxy
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net
    depends_on:
      - backend

# ==========================================
# CUSTOM BRIDGE NETWORK (Isolasi Antar Kontainer)
# ==========================================
networks:
  app-net:
    name: app-net
    driver: bridge

# ==========================================
# DOCKER NAMED VOLUMES (Data Immunity)
# ==========================================
volumes:
  lab-inventory-data:
    name: lab-inventory-data
